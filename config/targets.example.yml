    - salesforce:wd12:External_Career_Site
    - adobe:wd5:external_experienced
    - workday:wd5:Workday
    - autodesk:wd1:Ext
    - paypal:wd1:jobs
    - ebay:wd5:apply

  smartrecruiters:
    - WesternDigital
    - Visa
    - Experian
    - Wise
    - Socotec

  # Workable's widget feed answers for any account that exists, so HTTP 200
  # means nothing on its own — each slug here was kept only because the feed
  # came back holding open jobs.
  workable:
    - tp-link-usa-corp
    - worthai
    - rokt
    - seeq
    - fortanix
    - enfos-inc

  recruitee:
    - joinready
    - greatminds
    - resourcefultalentgroup
    - allshoretalent
    - zensai
    - somniosoftware

  breezy:
    - transact-campus
    - matroid
    - blenderbox
    - clever-real-estate
    - mind-computing
    - pri

  bamboohr:
    - alkira
    - selectorsoftware
    - lendio
    - canopy
    - level

  teamtailor:
    - softwarefinder.na
    - swishanalytics.na
    - crossmint.na
    - wagepoint
    - dabble
    - iqm

  # iCIMS publishes no JSON — these are read out of the portal's iframe HTML.
  # The defense-side tenants (Peraton, GDMS, Markon, SciRes, i2x/ISYS, Intrepid)
  # carry a lot of US-only software work.
  icims:
    - peraton
    - markon
    - scires
    - gdms
    - appliedsystems
    - i2xisys
    - kyocera
    - intrepidsolutions

  jazzhr:
    - g2ops
    - validity
    - snapsheet
    - atg
    - modernclassroomsproject
    - finconsus

  # Jobvite keys its XML feed by an opaque company id, never a name. Only one
  # tenant is listed on purpose, for two reasons:
  #   - every Jobvite apply URL is the same path (/CompanyJobs/Careers.aspx)
  #     with the job in the query string, and normalize.ts's dedupe key drops
  #     the query — so the whole family collapses to a single job no matter how
  #     many tenants are listed. Fix that key before widening this list.
  #   - the feeds are ~14MB each and app.jobvite.com starts 429ing after one or
  #     two in a cycle.
  # Verified live and ready to add once dedupe is fixed (id — company, postings
  # seen): qmRaVfw2 Visionist 74, qG2bVfwy SynQor 34, qsSaVfw9 Lowenstein
  # Sandler 18, q0QaVfwF CDW 5, qXQaVfwC GS1 US 3.
  jobvite:
    - quYbVfwi   # NinjaOne

  rippling:
    - rippling

  # Personio is a German ATS and its boards are EU-side; expect little US work.
  personio:
    - getsafe

# Self-hosted boards with no public feed. Client-rendered, so these are read
# through the fleet's browser rather than a JSON fetch.
eightfold:
  - host: apply.careers.microsoft.com
    company: Microsoft
    query: software engineer intern
    location: United States
