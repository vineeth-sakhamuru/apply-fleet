# Which job boards the fleet polls. Edit this, not the source.
#
# Every board below was verified live (it returned real postings) before being
# committed — an unverified slug is worse than no slug, because a dead board
# looks identical to "that ATS is broken".
#
# Adding a company:
#   1. find its board slug (the company segment of its careers URL)
#   2. add it under the right ats
#   3. run:  node packages/discovery/bench/probe-targets.ts
#      keep it only if it comes back with a job count
#
# Slug formats per ATS:
#   greenhouse       boards.greenhouse.io/<slug>
#   lever            jobs.lever.co/<slug>
#   ashby            jobs.ashbyhq.com/<slug>
#   smartrecruiters  jobs.smartrecruiters.com/<Slug>        (case-sensitive)
#   workable         apply.workable.com/<slug>
#   recruitee        <slug>.recruitee.com
#   breezy           <slug>.breezy.hr
#   personio         <slug>.jobs.personio.de
#   bamboohr         <slug>.bamboohr.com
#   teamtailor       <slug>.teamtailor.com                  (regional sites are
#                    <name>.na.teamtailor.com — the slug is then "<name>.na")
#   rippling         ats.rippling.com/<slug>
#   jazzhr           <slug>.applytojob.com
#   jobvite          app.jobvite.com/CompanyJobs/xml.aspx?c=<companyId>
#                    the id is opaque, so each one is labelled below; find it in
#                    the jobs.jobvite.com/<name> page source (the "q…" token)
#   icims            careers-<slug>.icims.com               (some tenants sit at
#                    careersN-<slug>; pass that whole label as the slug)
#   workday          "<tenant>:<datacenter>:<site>"  from
#                    <tenant>.<dc>.myworkdayjobs.com/<site>
#   eightfold        self-hosted board; give host + search query (browser-driven)
#
# Not configurable here: `linkedin` has no per-company feed — it's served by the
# query-driven Apify provider, which the orchestrator calls directly.

# How wide to cast the net and how hard to push.
settings:
  # Only surface postings newer than this. Tighten toward 24 for speed-to-post.
  max_age_hours: 720
  # In-flight feed requests. Unbounded fan-out makes Workday tenants drop out
  # entirely (they throttle under burst); 8 kept every board alive in testing.
  concurrency: 8
  # Minutes between discovery cycles.
  poll_minutes: 15

