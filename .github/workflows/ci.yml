name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium (browser tests)
        run: npx patchright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build dashboard (typecheck)
        run: npm run build -w @apply-fleet/web --if-present
